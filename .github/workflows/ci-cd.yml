name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']          
  pull_request:
    branches: [main]          

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # TESTS
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    outputs:
      error: ${{ steps.error.outputs.log }}
    defaults:
      run:
        shell: bash
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npm run lint 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npm test -- --ci 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Extract error
        id: error
        if: failure()
        run: |
          {
            echo 'log<<END_OF_LOG'
            tail -n 25 "$RUNNER_TEMP/ci.log"
            echo 'END_OF_LOG'
          } >> "$GITHUB_OUTPUT"

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    outputs:
      error: ${{ steps.error.outputs.log }}
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npm run lint 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - run: npx vitest run 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Extract error
        id: error
        if: failure()
        run: |
          {
            echo 'log<<END_OF_LOG'
            tail -n 25 "$RUNNER_TEMP/ci.log"
            echo 'END_OF_LOG'
          } >> "$GITHUB_OUTPUT"

  #  BUILD & PUSH
  docker:
    name: Build & push (${{ matrix.app }})
    needs: [test-api, test-frontend]      
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                     
    strategy:
      matrix:
        app: [api, frontend]
    env:
      APP_ENV: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ci-cd-${{ matrix.app }}
          flavor: latest=false
          tags: |
            # main branch -> development
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/main' }}
            # tag git v1.2.3 -> production
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENV=${{ env.APP_ENV }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  #  NOTIFICATION
  notify:
    name: Google Chat Notification
    needs: [test-api, test-frontend, docker]
    if: always()                          
    runs-on: ubuntu-latest
    steps:
      - name: Send message
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          STATUS: ${{ contains(needs.*.result, 'failure') && '❌ HOUSTON, WE HAVE A PROBLEM' || (contains(needs.*.result, 'cancelled') && 'ABORTED' || '✅ SUCCESS, WELL DONE!') }}
          R_API: ${{ needs.test-api.result }}
          R_FRONT: ${{ needs.test-frontend.result }}
          R_DOCKER: ${{ needs.docker.result }}
          ERR_API: ${{ needs.test-api.outputs.error }}
          ERR_FRONT: ${{ needs.test-frontend.outputs.error }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="${COMMIT_MSG%%$'\n'*}"
          TEXT="*${STATUS}* : ${GITHUB_REPOSITORY} (${GITHUB_REF_NAME})
          Commit : ${GITHUB_SHA::7} « ${TITLE} » by ${GITHUB_ACTOR}
          Jobs : tests API=${R_API} | tests front=${R_FRONT} | docker=${R_DOCKER}
          Logs : ${RUN_URL}"
          if [ -n "${ERR_API}${ERR_FRONT}" ]; then
            TEXT+=$'\n\n*Failure reason :*\n```\n'"${ERR_API}${ERR_FRONT}"$'\n```'
          fi
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json; charset=UTF-8' -d @- "$WEBHOOK"
