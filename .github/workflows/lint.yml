name : Lint

on:
  push:
    branches:
      - '**'
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version:22 }
      - run: npm run lint

